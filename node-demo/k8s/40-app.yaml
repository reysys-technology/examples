apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-demo
  namespace: node-demo
  labels:
    app.kubernetes.io/name: node-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: node-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-demo
        reysys.com/inject: "true"
      annotations:
        reysys.com/runtime: node
        reysys.com/service: node-demo
    spec:
      initContainers:
        - name: install
          image: node:22-alpine
          command:
            - sh
            - -c
            - cp /source/server.js /source/package.json /source/package-lock.json /app/ && cd /app && npm ci --omit=dev
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
          volumeMounts:
            - name: source
              mountPath: /source
              readOnly: true
            - name: app
              mountPath: /app
      containers:
        - name: node-demo
          image: node:22-alpine
          workingDir: /app
          command:
            - node
            - server.js
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PGHOST
              value: postgres
            - name: PGDATABASE
              value: node_demo
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
          volumeMounts:
            - name: app
              mountPath: /app
      volumes:
        - name: source
          configMap:
            name: node-demo-app
        - name: app
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: node-demo
  namespace: node-demo
  labels:
    app.kubernetes.io/name: node-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: node-demo
  ports:
    - name: http
      port: 8080
      targetPort: http
